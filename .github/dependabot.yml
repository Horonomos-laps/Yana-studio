# Modeled on Yana-AI .github/dependabot.yml: weekly, 7-day cooldown, minor and
# patch updates grouped per directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /yana-studio
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      yana-studio:
        patterns: ["*"]
        update-types: [minor, patch]
      yana-studio-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /yana-ide/studio-web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      studio-web:
        patterns: ["*"]
        update-types: [minor, patch]
      studio-web-security:
        applies-to: security-updates
        patterns: ["*"]
